[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tastedistrict"
version = "0.1.0"
description = "Explore city zones through cultural tastes, with evidence from Qloo."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.135.1",
  "httpx==0.28.1",
  "pydantic-settings==2.13.1",
  "uvicorn==0.41.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
